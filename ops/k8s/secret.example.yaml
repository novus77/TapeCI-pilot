# TapeCI Kubernetes Secret TEMPLATE — example placeholders only.
#
# THIS FILE CONTAINS NO REAL SECRETS AND IS NOT APPLIED AS-IS.
# It documents every key the api/worker/web Deployments expect. Create the real
# Secret out-of-band with one of:
#
#   kubectl -n tapeci create secret generic tapeci-secrets \
#     --from-literal=DATABASE_URL='postgres://...' \
#     --from-file=GITHUB_APP_PRIVATE_KEY=./app.private-key.pem \
#     --dry-run=client -o yaml | kubectl apply -f -
#
#   # or from an env file that is never committed:
#   kubectl -n tapeci create secret generic tapeci-secrets --from-env-file=./secret.env
#
# Recommended for production: an External Secrets Operator / Sealed Secrets /
# cloud secret manager sync into a Secret of this exact name and shape, so no
# credential ever lives in git. `ops/k8s/tapeci.yaml` defines an equivalent
# CHANGE_ME placeholder Secret so that `kubectl apply` stays self-consistent;
# replace it (or delete it and let the external controller own the name).
#
# Red line (AGENTS.md): never commit a real operator key, GitHub App key or DB
# password. If you are rotating values, rotate them in the secret manager, not here.
apiVersion: v1
kind: Secret
metadata:
  name: tapeci-secrets
  namespace: tapeci
  labels:
    app.kubernetes.io/name: tapeci
    app.kubernetes.io/component: secrets
  annotations:
    tapeci.example/owner: "platform"
    tapeci.example/rotation: "90d"
type: Opaque
stringData:
  # --- data stores (managed Postgres/Redis; no in-cluster DB in production) ----
  # Use sslmode=require (or verify-full) for a managed instance.
  DATABASE_URL: "postgres://CHANGE_ME_USER:CHANGE_ME_PASSWORD@CHANGE_ME_HOST:5432/tapeci?sslmode=require"
  # Use rediss:// when the managed Redis requires TLS.
  REDIS_URL: "rediss://:CHANGE_ME_PASSWORD@CHANGE_ME_HOST:6379"

  # --- session signing ------------------------------------------------------
  # HS256 key for session/build-token JWTs. Must be >= 16 chars; the API refuses
  # to boot otherwise. Generate with: openssl rand -base64 48
  SESSION_SIGNING_SECRET: "CHANGE_ME_AT_LEAST_32_CHARS"

  # --- GitHub App -----------------------------------------------------------
  GITHUB_APP_ID: "CHANGE_ME"
  # PEM private key, newlines preserved. From a file:
  #   kubectl -n tapeci create secret generic tapeci-secrets --from-file=GITHUB_APP_PRIVATE_KEY=app.pem
  # Placeholder only. Do NOT paste a real key here; inject the PEM from a file:
  #   kubectl -n tapeci create secret generic tapeci-secrets \
  #     --from-file=GITHUB_APP_PRIVATE_KEY=app.pem
  GITHUB_APP_PRIVATE_KEY: "CHANGE_ME_PEM_FROM_FILE"
  GITHUB_WEBHOOK_SECRET: "CHANGE_ME"
  GITHUB_OAUTH_CLIENT_ID: "CHANGE_ME"
  GITHUB_OAUTH_CLIENT_SECRET: "CHANGE_ME"

  # --- chain operator (write path) -----------------------------------------
  # The ONLY key that can write to X Layer 196. Keep it in a secret manager with
  # an audited access trail; the worker fails closed (INVALID_CONFIG) without it.
  TAPECI_OPERATOR_PRIVATE_KEY: "CHANGE_ME_0x_PRIVATE_KEY"
  TAPECI_WRITE_RPC_URL: "https://CHANGE_ME_WRITE_RPC"

  # --- object store (S3/R2) -------------------------------------------------
  # Prefer an IAM role / workload identity over static keys where available.
  S3_BUCKET: "CHANGE_ME_BUCKET"
  S3_ENDPOINT: "https://CHANGE_ME_ACCOUNT.r2.cloudflarestorage.com"
  S3_ACCESS_KEY_ID: "CHANGE_ME"
  S3_SECRET_ACCESS_KEY: "CHANGE_ME"

  # --- notifications --------------------------------------------------------
  SMTP_URL: "smtp://CHANGE_ME_USER:CHANGE_ME_PASSWORD@CHANGE_ME_HOST:587"

  # --- optional hardening ---------------------------------------------------
  # Bearer token for GET /metrics when Prometheus scrapes across a network.
  TAPECI_METRICS_TOKEN: "CHANGE_ME_OPTIONAL"
