---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: tapeci
spec:
  selector:
    app: tapeci-api
  ports:
    - name: http
      port: 8787
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: tapeci
spec:
  selector:
    app: tapeci-worker
  ports:
    - name: http
      port: 8788
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: tapeci
spec:
  selector:
    app: tapeci-web
  ports:
    - name: http
      port: 3000
      targetPort: http
