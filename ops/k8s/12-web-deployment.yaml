---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: tapeci
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tapeci-web
  template:
    metadata:
      labels:
        app: tapeci-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/example/tapeci-web:0.1.0
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: tapeci-config
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
