# Validation/apply entrypoint. secret.example.yaml is deliberately NOT a
# resource: it contains placeholders and must never be applied as-is. Create
# the real tapeci-secrets Secret via External Secrets/KMS or kubectl first.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace.yaml
  - 01-configmap.yaml
  - 10-api-deployment.yaml
  - 11-worker-deployment.yaml
  - 12-web-deployment.yaml
  - 20-services.yaml
  - 30-ingress.yaml
  - 40-pvc.yaml
  - 50-pdb.yaml
  - 60-networkpolicy.yaml
