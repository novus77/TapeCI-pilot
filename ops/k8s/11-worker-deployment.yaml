---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: tapeci
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tapeci-worker
  template:
    metadata:
      labels:
        app: tapeci-worker
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/example/tapeci-worker:0.1.0
          ports:
            - containerPort: 8788
              name: http
          envFrom:
            - configMapRef:
                name: tapeci-config
            - secretRef:
                name: tapeci-secrets
          volumeMounts:
            - name: journal
              mountPath: /app/.tapeci/journal
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: journal
          persistentVolumeClaim:
            claimName: tapeci-journal
