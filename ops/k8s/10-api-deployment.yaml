---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: tapeci
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tapeci-api
  template:
    metadata:
      labels:
        app: tapeci-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/example/tapeci-api:0.1.0
          ports:
            - containerPort: 8787
              name: http
          envFrom:
            - configMapRef:
                name: tapeci-config
            - secretRef:
                name: tapeci-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
