# TapeCI Prometheus scrape + rule example.
#
# This is an EXAMPLE for an existing Prometheus (k8s operator, Helm chart, or a
# standalone server that is not the compose one). `ops/prometheus/prometheus.yml`
# is the configuration actually mounted by infra/docker-compose.prod.yml; this
# file shows the same jobs adapted to a multi-instance / Kubernetes deployment.
#
# Metrics come from three places:
#   1. API    /metrics  (tapeci_api_*, tapeci_audit_scope_resolve_failures_total)
#   2. Worker /metrics  (tapeci_worker_*, tapeci_queue_jobs)
#   3. node_exporter textfile collector (tapeci_audit_backfill_*), written by the
#      scheduled `pnpm audit:backfill --textfile /var/lib/node_exporter/textfile/...`
#      job (see ops/systemd/tapeci-audit-backfill.service). Those are NOT exposed
#      by either HTTP endpoint, so without the textfile job the backfill panels
#      and the TapeCiAuditBackfillUnresolved/Stale alerts stay empty.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: tapeci-prod

rule_files:
  - tapeci-alerts.yml

scrape_configs:
  # --- API ------------------------------------------------------------------
  # In Kubernetes, scrape each pod so counters are not mixed between instances
  # (counters are process-local and reset on restart).
  - job_name: tapeci-api
    metrics_path: /metrics
    # When TAPECI_METRICS_TOKEN is set, the API requires this bearer token.
    # authorization:
    #   type: Bearer
    #   credentials_file: /etc/prometheus/secrets/tapeci-metrics-token
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [tapeci]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: tapeci-api
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        regex: "8787"
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: instance
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace

  # --- worker ---------------------------------------------------------------
  - job_name: tapeci-worker
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [tapeci]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: tapeci-worker
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        regex: "8788"
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: instance

  # --- audit backfill (node_exporter textfile collector) --------------------
  # The scheduled backfill writes a .prom file; node_exporter serves it on :9100.
  # Without this target, tapeci_audit_backfill_* is absent and the two backfill
  # alerts cannot fire.
  - job_name: node-textfile
    static_configs:
      - targets: ["node-exporter.monitoring.svc.cluster.local:9100"]
        labels:
          service: tapeci-audit-backfill

  # --- Prometheus itself (optional, useful for alerting on scrape health) ----
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

# --- minimal static equivalent (single host, no service discovery) -----------
# Use this instead of the kubernetes_sd_configs blocks when Prometheus runs on
# the same host as docker-compose.prod.yml:
