global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/tapeci-alerts.yml
scrape_configs:
  - job_name: tapeci-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8787"]
  - job_name: tapeci-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:8788"]
  - job_name: node-textfile
    static_configs:
      - targets: ["node-exporter:9100"]
