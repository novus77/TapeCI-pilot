# Real S3-compatible object store for integration tests.
#   docker compose -f infra/docker-compose.test.yml up -d
#   S3_ENDPOINT=http://127.0.0.1:59000 ... pnpm test:s3
name: tapeci-storage-test
services:
  minio:
    image: minio/minio:latest
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: tapeci
      MINIO_ROOT_PASSWORD: tapeci-test-secret
    ports:
      - "127.0.0.1:59000:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30
